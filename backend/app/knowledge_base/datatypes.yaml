- id: object_to_datetime
  category: datatype
  severity: medium
  applies_to: text
  condition: "is_datetime_convertible == True"
  recommendation: "Convert to datetime"
  reason: "This column's values look like dates but are stored as plain text. As text, dates can't be sorted chronologically, filtered by date range, or used to extract features like month/day-of-week."
  advantages:
    - "Enables chronological sorting and date-range filtering"
    - "Unlocks date-based feature engineering (extract year, month, day of week)"
  disadvantages:
    - "A handful of malformed entries may become missing values (NaT) after conversion — check the missing value tools afterward"
  alternatives:
    - "Leave as text if the values aren't actually meant to represent dates"
  docs_url: "https://pandas.pydata.org/docs/reference/api/pandas.to_datetime.html"

