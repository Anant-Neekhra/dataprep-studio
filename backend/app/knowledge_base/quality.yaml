- id: whitespace_issues
  category: data_quality
  severity: low
  applies_to: categorical
  condition: "has_whitespace == True"
  recommendation: "Strip leading/trailing whitespace"
  reason: "Values with extra whitespace (e.g. 'Yes ' vs 'Yes') are treated as distinct categories by most tools, silently inflating cardinality and breaking exact-match filters or joins."
  advantages:
    - "Simple, safe, one-line fix"
    - "Prevents duplicate categories caused purely by formatting"
  disadvantages:
    - "None — this is almost always safe to apply"
  alternatives:
    - "Leave as-is (only safe if you've confirmed whitespace is meaningful, which is rare)"
  docs_url: "https://pandas.pydata.org/docs/reference/api/pandas.Series.str.strip.html"

