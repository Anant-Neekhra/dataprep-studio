- id: missing_low_numerical
  category: missing_values
  severity: low
  applies_to: numerical
  condition: "missing_pct > 0 and missing_pct <= 5"
  recommendation: "Impute using Median, or drop the affected rows"
  reason: "A small amount of missing data (under 5%) rarely biases analysis regardless of how it's handled."
  advantages:
    - "Minimal impact on the dataset either way"
    - "Simple and fast to apply"
  disadvantages:
    - "Dropping rows still loses a small amount of information"
  alternatives:
    - "Mean Imputation"
    - "Drop Rows"
  docs_url: "https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.dropna.html"

- id: missing_moderate_numerical
  category: missing_values
  severity: medium
  applies_to: numerical
  condition: "missing_pct > 5 and missing_pct <= 30"
  recommendation: "Impute using Median"
  reason: "Between 5-30% missing is enough to hurt analysis if dropped, but not so much that imputation becomes unreliable."
  advantages:
    - "Preserves all rows, no data loss"
    - "Robust to outliers, unlike mean"
  disadvantages:
    - "Reduces variance in the column"
    - "Can distort relationships with other variables if missingness isn't random"
  alternatives:
    - "Mean Imputation"
    - "KNN Imputer"
    - "Drop Rows"
  docs_url: "https://scikit-learn.org/stable/modules/generated/sklearn.impute.SimpleImputer.html"

- id: missing_high_numerical
  category: missing_values
  severity: high
  applies_to: numerical
  condition: "missing_pct > 30 and missing_pct <= 60"
  recommendation: "Consider KNN Imputer, or evaluate dropping the column"
  reason: "Over 30% missing means simple imputation (mean/median) may introduce significant bias, since you'd be inventing a large portion of the column's values."
  advantages:
    - "KNN Imputer uses relationships with other columns, often more accurate than simple imputation at this level of missingness"
  disadvantages:
    - "KNN Imputer is computationally expensive on large datasets"
    - "Still risky — consider whether this column is worth keeping at all"
  alternatives:
    - "Median Imputation"
    - "Drop Column"
  docs_url: "https://scikit-learn.org/stable/modules/generated/sklearn.impute.KNNImputer.html"

- id: missing_very_high_numerical
  category: missing_values
  severity: high
  applies_to: numerical
  condition: "missing_pct > 60"
  recommendation: "Drop this column"
  reason: "With over 60% of values missing, any imputation strategy is mostly inventing data rather than estimating it. The column likely carries little reliable signal."
  advantages:
    - "Removes a column that would otherwise dominate imputation uncertainty"
  disadvantages:
    - "Permanently loses whatever partial signal the column did have"
  alternatives:
    - "KNN Imputer (if the column is domain-critical)"
  docs_url: "https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.drop.html"

- id: missing_low_categorical
  category: missing_values
  severity: low
  applies_to: categorical
  condition: "missing_pct > 0 and missing_pct <= 5"
  recommendation: "Impute using Mode, or drop the affected rows"
  reason: "A small amount of missing data in a categorical column has minimal impact on the overall category distribution."
  advantages:
    - "Simple and preserves row count"
  disadvantages:
    - "Slightly inflates the most frequent category"
  alternatives:
    - "Drop Rows"
    - "Constant fill (e.g. 'Unknown')"
  docs_url: "https://scikit-learn.org/stable/modules/generated/sklearn.impute.SimpleImputer.html"

- id: missing_moderate_categorical
  category: missing_values
  severity: medium
  applies_to: categorical
  condition: "missing_pct > 5 and missing_pct <= 30"
  recommendation: "Impute using Mode, or a constant placeholder like 'Unknown'"
  reason: "At this level, blindly filling with the mode noticeably shifts the category distribution. Treating missingness as its own category is often more honest."
  advantages:
    - "Constant fill preserves the fact that data was missing, which can itself be informative"
  disadvantages:
    - "Mode imputation exaggerates the dominant category"
  alternatives:
    - "Mode Imputation"
    - "Drop Rows"
  docs_url: "https://scikit-learn.org/stable/modules/generated/sklearn.impute.SimpleImputer.html"

- id: missing_high_categorical
  category: missing_values
  severity: high
  applies_to: categorical
  condition: "missing_pct > 30"
  recommendation: "Treat missing as its own category (e.g. 'Missing'), or consider dropping the column"
  reason: "At this level, missingness itself may be a meaningful pattern rather than noise — forcing values into existing categories would be misleading."
  advantages:
    - "Preserves the signal that 'missingness' itself may carry"
  disadvantages:
    - "Adds a new category that downstream encoding needs to handle"
  alternatives:
    - "Drop Column"
  docs_url: "https://scikit-learn.org/stable/modules/generated/sklearn.impute.SimpleImputer.html"